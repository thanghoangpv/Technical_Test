<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books - Pages & Co.</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/pages/books/books.css" />
    <link rel="stylesheet" href="./css/components/navbar.css" />
    <link rel="stylesheet" href="./css/components/footer.css" />
    <link rel="stylesheet" href="./css/pages/bag/breadcrumb.css" />
    <link rel="stylesheet" href="./css/components/book-card.css" />
    <link rel="stylesheet" href="./css/components/login-modal.css" />
  </head>
  <body>
    <header id="navbar-container" class="navbar"></header>
    <main class="page">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="#">Home</a>
        <span>/</span>
        <span class="breadcrumb-current">Books</span>
      </nav>

      <header class="page-header">
        <div>
          <h1 class="page-title">All books</h1>
          <p class="page-subtitle">14 titles in the collection</p>
        </div>
      </header>

      <section class="controls" aria-label="Filters and sort">
        <!-- <div class="filters">
          <button class="filter-btn is-active" type="button">All</button>
          <button class="filter-btn" type="button">Fiction</button>
          <button class="filter-btn" type="button">Mystery</button>
          <button class="filter-btn" type="button">Sci-Fi</button>
          <button class="filter-btn" type="button">Non-fiction</button>
          <button class="filter-btn" type="button">Poetry</button>
          <button class="filter-btn" type="button">Children</button>
          <button class="filter-btn" type="button">Biography</button>
        </div> -->
        <div class="filters" id="filtersContainer"></div>

        <div class="sort">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option>Featured</option>
            <option>Newest</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
          </select>
        </div>
      </section>

      <section
        class="book-grid"
        id="listBooksGrid"
        aria-label="Book list"
      ></section>
    </main>
    <footer id="footer-container"></footer>

    <div id="login-modal-container"></div>

    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
